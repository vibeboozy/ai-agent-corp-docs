<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Агент по регламентам - Служба качества</title>
    <meta name="description" content="Корпоративный ИИ-агент по регламентам Отдела качества" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/layout.css" />
    <link rel="stylesheet" href="/src/styles/chat.css" />
    <link rel="stylesheet" href="/src/styles/quality.css" />
  </head>
  <body>
    <div id="app" class="app-layout">
      <!-- Верхняя панель (Header) -->
      <header class="app-header">
        <div class="header-left">
          <div class="brand">
            <div class="brand-icon" aria-hidden="true">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10a10 10 0 0 1-10-10C2 6.477 6.477 2 12 2z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
            </div>
            <div class="brand-text">
              <span class="brand-title">Агент по регламентам</span>
              <span class="brand-subtitle">Служба качества</span>
            </div>
          </div>

          <nav class="header-nav" aria-label="Основная навигация">
            <button
              id="tab-btn-chat"
              class="nav-tab active"
              data-tab="chat"
              type="button"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              <span>Чат сотрудника</span>
            </button>
            <button
              id="tab-btn-quality"
              class="nav-tab"
              data-tab="quality"
              type="button"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="3" rx="2"/>
                <path d="M9 17V7h6"/>
                <path d="M13 13h-4"/>
              </svg>
              <span>Кабинет Службы качества</span>
              <span
                id="header-ticket-badge"
                class="tab-badge hidden"
                aria-label="Открытые тикеты"
              >0</span>
            </button>
          </nav>
        </div>

        <div class="header-right">
          <!-- Переключатель режима Mock / API -->
          <div class="mode-switch-wrapper" title="Режим работы источника данных">
            <span class="mode-label">Режим:</span>
            <div class="segmented-control" role="radiogroup" aria-label="Режим работы">
              <button
                type="button"
                id="mode-mock-btn"
                class="segmented-btn active"
                data-mode="mock"
                role="radio"
                aria-checked="true"
              >
                Mock
              </button>
              <button
                type="button"
                id="mode-api-btn"
                class="segmented-btn"
                data-mode="api"
                role="radio"
                aria-checked="false"
              >
                API
              </button>
            </div>
          </div>

          <!-- Кнопка настроек -->
          <div class="settings-wrapper">
            <button
              id="settings-toggle-btn"
              class="icon-btn"
              type="button"
              title="Настройки подключения"
              aria-label="Настройки подключения"
              aria-expanded="false"
              aria-haspopup="dialog"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </button>

            <!-- Поповер настроек -->
            <div id="settings-popover" class="settings-popover hidden" role="dialog" aria-labelledby="settings-popover-title">
              <div class="popover-header">
                <h3 id="settings-popover-title" class="popover-title">Настройки</h3>
                <button id="settings-close-btn" type="button" class="close-btn" aria-label="Закрыть">×</button>
              </div>
              <div class="popover-body">
                <div class="form-group">
                  <label for="api-base-url-input">API Base URL</label>
                  <input
                    id="api-base-url-input"
                    type="text"
                    class="form-control"
                    placeholder="/api"
                    value="/api"
                  />
                  <small class="form-hint">Базовый адрес для запросов в режиме API</small>
                </div>

                <div class="popover-actions">
                  <button id="save-api-url-btn" type="button" class="btn btn-secondary btn-sm">
                    Сохранить URL
                  </button>
                  <button id="reset-demo-btn" type="button" class="btn btn-danger-outline btn-sm">
                    Сбросить демо-данные
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- Основная область контента -->
      <main class="app-main">
        <!-- Вкладка 1: Чат сотрудника -->
        <section id="tab-chat" class="tab-pane active" aria-labelledby="tab-btn-chat">
          <!-- Рендерится динамически через chatTab.js -->
        </section>

        <!-- Вкладка 2: Кабинет Службы качества -->
        <section id="tab-quality" class="tab-pane hidden" aria-labelledby="tab-btn-quality">
          <!-- Рендерится динамически через qualityTab.js -->
        </section>

        <!-- Вкладка 3: Заглушка-модуль аналитики -->
        <section id="tab-analytics" class="tab-pane hidden">
          <!-- Рендерится динамически через analyticsTab.js -->
        </section>
      </main>

      <!-- Контейнер для тостов -->
      <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
