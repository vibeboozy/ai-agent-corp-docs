# Golden scenarios for local live dialogue (read-only LangGraph).
# Run:  python scripts/run_golden_scenarios.py
# Log:  artifacts/golden-run.log  (paste this file back)

cases:
  - id: GS-01
    scenario: answer
    question: За сколько рабочих дней необходимо инициировать заявку на пресейл ДБРЦТ?
    expected_behavior: >-
      Короткий ответ: не менее чем за 3 рабочих дня до подачи предложения Заказчику
      (п. 1.5 Проектная деятельность ДБРЦТ). Не escalate paraphrase_required на
      Presale IB 3.4/6.9 wait/timeout соседях — prefer lead-time/инициация clause.
    expected_doc: Проектная деятельность ДБРЦТ
    locator: п. 1.5

  # Near-duplicate of GS-01: only the preposition «в» before ДБРЦТ.
  # Live bug: hybrid+LLM steered to Presale IB 3.4/6.9 → escalate paraphrase_required.
  - id: GS-01b
    scenario: answer
    question: За сколько рабочих дней необходимо инициировать заявку на пресейл в ДБРЦТ?
    expected_behavior: >-
      Same ground truth as GS-01 (п. 1.5, ≥3 рабочих дня). Must not diverge to
      Presale IB wait/timeout or escalate paraphrase_required just because of «в».
    expected_doc: Проектная деятельность ДБРЦТ
    locator: п. 1.5

  - id: GS-02
    scenario: answer
    question: Кто подписывает договоры на закупку?
    expected_behavior: >-
      Юридические лица Компании (п. 9.5 Пресейловая). Retrieval must surface 9.5
      (synonym expand + deterministic blend; skip flaky LLM rerank for purchase WHO).
      Не АМ/20.7 / ДС / сроки подписания; не checklist junk.
    expected_doc: Пресейловая деятельность Дирекции ИБ
    locator: п. 9.5

  - id: GS-03
    scenario: answer
    question: В течение какого срока Координатор департамента назначает РП при наличии полного Расчёта проекта?
    expected_behavior: В течение 1 рабочего дня (п. 2.7 Проектная деятельность Дирекции ИБ).
    expected_doc: Проектная деятельность Дирекции ИБ
    locator: п. 2.7

  - id: GS-04
    scenario: answer
    question: За сколько назначается РП в Дирекции ИБ при предоставлении полной информации?
    expected_behavior: Тот же ground truth, что GS-03 — 1 рабочий день (п. 2.7), не escalate.
    expected_doc: Проектная деятельность Дирекции ИБ
    locator: п. 2.7

  - id: GS-05
    scenario: answer
    question: Кто отвечает за организацию отчётности по проекту?
    expected_behavior: Руководитель проекта (РП).
    expected_doc: Организация проектной деятельности / Проектная деятельность ДБРЦТ
    locator: п. 18.1 / п. 15.1

  - id: GS-06
    scenario: answer
    question: За какой срок Пресейл-архитектор обязан принять заявку в работу после назначения?
    expected_behavior: В течение 1 рабочего дня с момента назначения (п. 5.1 Пресейловая ИБ).
    expected_doc: Пресейловая деятельность Дирекции ИБ
    locator: п. 5.1

  - id: GS-07
    scenario: answer
    question: За сколько РП создаёт проект в системе управления проектами после подписания договора в ДБРЦТ?
    expected_behavior: В течение 1 рабочего дня (п. 10.1 ДБРЦТ).
    expected_doc: Проектная деятельность ДБРЦТ
    locator: п. 10.1

  - id: GS-08
    scenario: clarify
    question: Кто отвечает за организацию?
    expected_behavior: Уточняющий вопрос (нет темы). Не answer / не escalate на первом ходе.
    expected_doc: ""
    locator: ""

  - id: GS-09
    scenario: clarify
    question: Кто подписывает договоры?
    expected_behavior: Уточнение scope (закупка vs иное). Не отвечать п. 9.5 без уточнения.
    expected_doc: ""
    locator: ""

  - id: GS-10
    scenario: clarify
    question: Какой срок на пресейл?
    expected_behavior: Уточнить подразделение / тип оценки. Не усреднять разные SLA.
    expected_doc: ""
    locator: ""

  - id: GS-11
    scenario: escalate
    question: Какой точный процент пороговой маржинальности установлен в Дирекции ИБ?
    expected_behavior: Escalate (irrelevant_citations / insufficient). Не отвечать чужим чанком.
    expected_doc: ""
    locator: ""

  - id: GS-12
    scenario: escalate
    question: Чему равна целевая маржинальность услуг по регламенту Дирекции ИБ?
    expected_behavior: Escalate — число в регламенте не задано.
    expected_doc: ""
    locator: ""

  - id: GS-13
    scenario: escalate
    question: Какой точный SLA в рабочих днях на поиск и согласование подрядчика при оценке в ДБРЦТ?
    expected_behavior: Escalate — п. 1.7 отсылает к SLA без числа дней.
    expected_doc: ""
    locator: ""

  - id: GS-14
    scenario: refuse
    question: Какая сегодня погода в Москве?
    expected_behavior: Вежливый отказ вне домена. Без quality / escalate.
    expected_doc: ""
    locator: ""

  - id: GS-15
    scenario: refuse
    question: Как приготовить борщ?
    expected_behavior: Отказ — не про корпоративные регламенты.
    expected_doc: ""
    locator: ""

  - id: GS-16
    scenario: refuse
    question: Что говорит Конституция РФ о свободе слова?
    expected_behavior: >-
      Refuse via ALLOWED_TOPICS gate (Конституция не в allowlist → off_topic).
      Не answer junk из корпоративных регламентов. Если ALLOWED_TOPICS включает
      «Конституция РФ» и корпус ingest — кейс не применять как refuse.
    expected_doc: ""
    locator: ""
